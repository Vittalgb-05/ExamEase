# Render Blueprint for ExamEase
# Create a "Blueprint" on render.com and connect your GitHub repository.
# Set DATABASE_URL (e.g. from Neon or Render PostgreSQL); SECRET_KEY is generated automatically.
services:
  - type: web
    name: examease
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn examsys.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
