# Render Blueprint for ExamEase
# Deploy via Render Dashboard > Blueprints > Connect GitHub Repository
services:
  - type: web
    name: examease
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn examsys.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: examease-db
          property: connectionString

databases:
  - name: examease-db
    plan: free
    databaseName: examease
    user: examease
